name: Python analysis tests

on:
  push:
    branches: [main, "review/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: savings-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q analysis.py run_analysis.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible analysis
        run: python run_analysis.py
